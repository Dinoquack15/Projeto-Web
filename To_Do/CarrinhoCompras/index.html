<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercadinho</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h3>Mercadinho do Jobson</h3>
    </header>
    <main>
        <label for="filtro">Filtrar produtos:</label>
        <select id="filtro">
            <option value="todos">Todos</option>
            <option value="ate50">Produtos até R$50</option>
            <option value="acimade50">Produtos acima de R$50</option>
        </select>
        <h2 class="titulo">Produtos</h2>
        <div id="listaItems"></div>
        <h2 class="titulo">Carrinho</h2>
        <div id="itensCarrinho"></div>
        <h3 id="total">Total: R$ 0,00</h3>
    </main>
    <footer>

    </footer>
</body>
</html>
